name: Build modules

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "patches/**"
      - "scripts/build-modules.sh"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "patches/**"
      - "scripts/build-modules.sh"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      cx_version:
        description: "CrossOver source version to build against (e.g. 26.3.0)"
        required: true
        default: "26.3.0"

permissions:
  contents: read

env:
  CX_VER: ${{ inputs.cx_version || '26.3.0' }}
  # Releases are published from this runner's build.
  RELEASE_RUNNER: macos-26

jobs:
  build:
    name: build (${{ matrix.runner }})
    # Apple Silicon runners; the modules are x86_64 and configure runs test binaries under Rosetta.
    runs-on: ${{ matrix.runner }}
    # xcode-27 (macOS 27 + Xcode 27 beta) is a preview image; don't let it block releases.
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            experimental: false
          - runner: xcode-27
            experimental: true
    steps:
      - uses: actions/checkout@v7

      - name: Install Rosetta 2
        run: /usr/sbin/softwareupdate --install-rosetta --agree-to-license

      - name: Install build dependencies
        run: ./scripts/build-modules.sh deps

      - name: Cache CrossOver source archive
        uses: actions/cache@v6
        with:
          path: build/crossover-sources-${{ env.CX_VER }}.tar.gz
          key: crossover-sources-${{ env.CX_VER }}

      - name: Fetch Wine source
        run: ./scripts/build-modules.sh fetch

      - name: Apply patches
        run: ./scripts/build-modules.sh apply

      - name: Configure
        run: ./scripts/build-modules.sh configure

      - name: Build
        run: ./scripts/build-modules.sh build

      - name: Package
        run: ./scripts/build-modules.sh package

      - uses: actions/upload-artifact@v7
        with:
          name: endfield-wine-modules-cx${{ env.CX_VER }}-${{ matrix.runner }}
          path: |
            dist/endfield-wine-modules.tar.gz
            dist/endfield-wine-modules.tar.gz.sha256
          if-no-files-found: error

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-cx${{ env.CX_VER }}-${{ matrix.runner }}
          path: |
            build/configure.log
            build/build.log
            build/wine-build64/config.log
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: endfield-wine-modules-cx${{ env.CX_VER }}-${{ env.RELEASE_RUNNER }}
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME (CrossOver $CX_VER)" \
            --generate-notes
